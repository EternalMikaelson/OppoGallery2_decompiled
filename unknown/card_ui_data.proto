syntax = "proto2";

package com.oplus.cardwidget.proto;

option java_multiple_files = true;

message UIDataProto {
  required int32 cardId   = 1;
  required string data = 2;
  map<string, int32> idMaps = 3;
  optional string name = 4;
  optional int64 version = 5;
  optional int32 themeId = 6;
  optional bytes value = 7;
  optional bool forceChangeCardUI = 8;
  optional DataCompress compress = 9;
  optional string layoutName = 10;
  optional string extraMsg = 11;

  enum DataCompress {
    NONE = 0;
    FLATER = 1;
    SIMPLIFY = 2;
  }
}
